## =============================================================
## ADRN — Production Application Configuration
## Uses environment variables — NEVER commit real values here
## =============================================================

spring:
  application:
    name: adrn-emergency-backend

  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:nova_db}
      auto-index-creation: true

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000

server:
  port: ${PORT:8080}

# ── JWT ──────────────────────────────────────────────────────
nova:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000
  otp:
    expiry-seconds: 300
  seed:
    enabled: false          # NEVER seed in production
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://your-domain.com}
  frontend:
    url: ${FRONTEND_URL:https://your-domain.com}
  backend:
    url: ${BACKEND_URL:https://api.your-domain.com}

# ── ADRN AI Configuration ────────────────────────────────────
adrn:
  ai:
    provider: ${ADRN_AI_PROVIDER:mock}   # mock | bedrock
  bedrock:
    model-id: ${BEDROCK_MODEL_ID:anthropic.claude-3-sonnet-20240229-v1:0}
    region: ${AWS_REGION:us-east-1}

# ── Logging (CloudWatch-friendly JSON format) ────────────────
logging:
  level:
    com.nova: INFO
    org.springframework.security: WARN
  pattern:
    console: '{"timestamp":"%d{ISO8601}","level":"%level","service":"adrn-backend","message":"%msg"}%n'

# ── Async / Scheduling ───────────────────────────────────────
spring.task:
  execution:
    pool:
      core-size: 8
      max-size: 16
  scheduling:
    pool:
      size: 4
