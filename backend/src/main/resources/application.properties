# ============================================================
# PROJECT NOVA — Spring Boot Application Properties
# ============================================================

# Server
server.port=${PORT:8080}

# ─── MongoDB Atlas ───────────────────────────────────────────
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/nova_db}
spring.data.mongodb.database=${MONGODB_DATABASE:nova_db}
spring.data.mongodb.auto-index-creation=true

# ─── JWT Configuration ───────────────────────────────────────
# IMPORTANT: Change this secret before deploying to production (min 32 chars)
nova.jwt.secret=${JWT_SECRET:ProjectNOVA_SuperSecretKey_ChangeMeInProduction_2024!}
nova.jwt.expiration=86400000

# ─── OTP Configuration ───────────────────────────────────────
# OTP expires in exactly 30 seconds (production requirement)
nova.otp.expiry-seconds=300

# ─── Data Seeder ─────────────────────────────────────────────
# Set to false after first run to avoid re-seeding
nova.seed.enabled=true

# ─── Frontend URL (for OAuth redirect) ──────────────────────
nova.frontend.url=${FRONTEND_URL:http://localhost:3000}

# ─── Logging ────────────────────────────────────────────────
logging.level.com.nova=DEBUG
logging.level.org.springframework.security=WARN

# ─── CORS (configured in SecurityConfig) ────────────────────
nova.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ─── Spring Mail Configuration (Gmail SMTP) ──────────────────
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ─── Google OAuth 2.0 Configuration ─────────────────────────
# Registered in Google Cloud Console
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:placeholder-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:placeholder-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:3000/api/auth/callback/google}
nova.backend.url=${BACKEND_URL:http://localhost:8080}

# ─── Async processing (for SSE broadcasts) ──────────────────
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8

# ─── App Info ────────────────────────────────────────────────
spring.application.name=nova-emergency-backend
